<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c130f">
<title>패널티킥 세이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img { max-width: 100%; }
  /* Layout: floodlit night match. LED scoreboard sits on top of the turf canvas; the ranking list sits beside it (below on phones). Single dark look by choice. */
  :root {
    color-scheme: dark;
    --night: #0c130f;
    --panel: #131d17;
    --panel-2: #1b2a21;
    --rule: #2a3b30;
    --chalk: #eef3ea;
    --chalk-dim: #9db1a3;
    --lamp: #ffbe3b;
    --lamp-ink: #1b1403;
    --lamp-glow: rgba(255, 190, 59, 0.45);
    --turf-a: #1d6a38;
    --turf-b: #195e31;
    --net: #0a110d;
    --ink: #16201a;
    --kick: #e24b3d;
    --goal: #ff6b57;
    --skin: #e8c8a2;
    --scrim: rgba(8, 14, 10, 0.8);
    --silver: #c4d0c8;
    --bronze: #d08f5c;
    --f-led: 'Doto', 'Courier New', ui-monospace, monospace;
    --f-body: 'Noto Sans KR', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  [hidden] { display: none !important; }
  body {
    background: var(--night);
    color: var(--chalk);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.55;
    padding-block: 22px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
  .lede { margin: 8px 0 0; color: var(--chalk-dim); max-width: 46ch; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
    gap: 32px;
    margin-top: 22px;
    align-items: start;
  }
  @media (max-width: 780px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  /* the pitch never grows taller than the screen, so the whole field stays visible on a phone */
  .stage { min-width: 0; width: 100%; max-width: max(300px, min(100%, calc((100dvh - 210px) * 9 / 14))); margin-inline: auto; }
  .overlay { overflow-y: auto; }
  .overlay .card { margin-block: auto; }
  @media (max-width: 780px) {
    body { padding-block-start: 12px; }
    .lede, .hint { display: none; }
    .layout { margin-top: 12px; gap: 20px; }
    .card { gap: 9px; }
    .rules { display: none; }
    #kitPrev { width: 52px; height: 52px; }
  }
  #cv { -webkit-tap-highlight-color: transparent; }

  .led {
    font-family: var(--f-led);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--lamp);
    text-shadow: 0 0 12px var(--lamp-glow);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--net);
    border: 1px solid var(--rule);
    border-radius: 10px 10px 0 0;
  }
  .cell { padding: 9px 4px 8px; text-align: center; border-left: 1px solid var(--rule); min-width: 0; }
  .cell:first-child { border-left: 0; }
  .lab { display: block; font-size: 11px; letter-spacing: 0.08em; color: var(--chalk-dim); }
  .val { display: block; font-size: 30px; line-height: 1.15; }
  .pips { display: flex; justify-content: center; align-items: center; gap: 7px; height: 34px; }
  .pip { box-sizing: border-box; width: 14px; height: 14px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 10px var(--lamp-glow); }
  .pip.lost { background: transparent; border: 2px solid var(--rule); box-shadow: none; }

  .field {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--rule);
    border-top: 0;
    border-radius: 0 0 10px 10px;
    background: var(--turf-a);
  }
  #cv { display: block; width: 100%; height: auto; aspect-ratio: 9 / 14; touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--scrim); }
  .card { width: min(100%, 304px); display: grid; gap: 12px; }
  .card h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .flabel { display: block; margin-bottom: 4px; font-size: 12px; color: var(--chalk-dim); }
  input[type="text"] {
    box-sizing: border-box; width: 100%; padding: 11px 12px;
    background: var(--net); color: var(--chalk);
    border: 1px solid var(--rule); border-radius: 8px;
    font: inherit; font-size: 16px;
  }
  input[type="text"]::placeholder { color: var(--chalk-dim); opacity: 0.7; }
  input[type="text"]:focus-visible, .btn:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
  .btn {
    width: 100%; padding: 12px 18px; border: 0; border-radius: 8px;
    background: var(--lamp); color: var(--lamp-ink);
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btnrow { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; }
  .btn.ghost { background: var(--goal); color: var(--lamp-ink); }
  .btn:active { transform: translateY(1px); }
  select {
    box-sizing: border-box; width: 100%; padding: 11px 12px;
    background: var(--net); color: var(--chalk);
    border: 1px solid var(--rule); border-radius: 8px;
    font: inherit; font-size: 16px;
  }
  select:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
  .teamrow { display: flex; align-items: center; gap: 12px; }
  .teamrow select { flex: 1 1 auto; min-width: 0; }
  #kitPrev { flex: none; width: 64px; height: 64px; border-radius: 8px; background: var(--turf-a); }
  .kit {
    display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: -1px;
    border: 1px solid rgba(238, 243, 234, 0.35);
    background: linear-gradient(var(--k1) 0 60%, var(--k2) 60% 100%);
  }
  .rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--chalk-dim); }
  .result { display: flex; align-items: baseline; gap: 8px; }
  .result .led { font-size: 56px; line-height: 1; }
  .result span { font-size: 16px; color: var(--chalk-dim); }
  .detail { margin: 0; color: var(--chalk-dim); font-size: 14px; }
  .status { margin: 0; min-height: 1.5em; font-size: 14px; }

  .mods { margin: 10px 2px 0; font-size: 13px; color: var(--chalk-dim); }
  .mods b { color: var(--chalk); font-weight: 500; }
  .hint { margin: 4px 2px 0; font-size: 12px; color: var(--chalk-dim); }

  .rank { min-width: 0; }
  .rank h2 { margin: 0 0 2px; font-size: 18px; letter-spacing: -0.01em; }
  .rank .sub { margin: 0 0 10px; color: var(--chalk-dim); font-size: 13px; }
  #rows { list-style: none; margin: 0; padding: 0; }
  #rows li {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    padding: 10px; border-bottom: 1px solid var(--rule);
  }
  #rows li.empty { display: block; color: var(--chalk-dim); border-bottom: 0; padding-inline: 0; }
  #rows li.mine { background: var(--panel-2); border-radius: 8px; border-bottom-color: transparent; }
  .rk { font-family: var(--f-led); font-weight: 700; font-size: 20px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
  li.podium .rk { color: var(--lamp); }
  .nmrow { display: flex; align-items: center; min-width: 0; }
  .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .chip { flex: none; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: var(--lamp); color: var(--lamp-ink); font-size: 11px; font-weight: 700; }
  .sub2 { display: block; font-size: 12px; color: var(--chalk-dim); font-weight: 400; }
  .sc { text-align: right; white-space: nowrap; }
  .sc .led { font-size: 24px; }
  .sc small { margin-left: 3px; font-size: 12px; color: var(--chalk-dim); }
  .podium {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end;
    margin: 6px 0 14px;
  }
  .pslot { min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pinfo { width: 100%; min-width: 0; padding: 0 2px 8px; display: grid; gap: 1px; justify-items: center; }
  .pname { max-width: 100%; display: flex; align-items: center; justify-content: center; min-width: 0; font-weight: 700; font-size: 14px; }
  .pname .nm { flex: 0 1 auto; }
  .pteam { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--chalk-dim); }
  .pscore { display: flex; align-items: baseline; gap: 3px; }
  .pscore .led { font-size: 28px; line-height: 1.1; }
  .pscore small { font-size: 12px; color: var(--chalk-dim); }
  .pstep {
    box-sizing: border-box; width: 100%; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px;
    background: var(--panel-2); border: 1px solid var(--rule); border-bottom: 0; border-radius: 8px 8px 0 0;
    font-family: var(--f-led); font-weight: 900; font-size: 34px; line-height: 1; color: var(--c);
  }
  .pslot.p1 { --c: var(--lamp); }
  .pslot.p2 { --c: var(--silver); }
  .pslot.p3 { --c: var(--bronze); }
  .pslot.p1 .pstep { height: 92px; border-color: var(--lamp); box-shadow: 0 0 18px var(--lamp-glow); }
  .pslot.p2 .pstep { height: 68px; }
  .pslot.p3 .pstep { height: 50px; }
  .pslot.me .pstep { background: var(--panel); outline: 2px solid var(--chalk); outline-offset: -2px; }
  .pslot.vacant .pstep { border-style: dashed; color: var(--rule); box-shadow: none; }
  .pslot.vacant .pinfo { visibility: hidden; }
  .podium-base { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--rule); margin-top: -8px; }
  .note { margin: 12px 0 0; font-size: 13px; color: var(--chalk-dim); }
  .mybest { margin: 4px 0 0; font-size: 13px; color: var(--chalk-dim); }

  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

</head>
<body>
<main class="wrap">
  <header>
    <h1>패널티킥 세이브</h1>
    <p class="lede">슈팅을 막을 때마다 레벨이 올라갑니다. 실점 3번이면 경기가 끝나고, 기록은 순위표에서 서로 비교합니다.</p>
  </header>

  <div class="layout">
    <section class="stage" aria-label="게임">
      <div class="board" aria-live="off">
        <div class="cell"><span class="lab">레벨</span><span class="val led" id="hLevel">1</span></div>
        <div class="cell"><span class="lab">선방</span><span class="val led" id="hSaves">0</span></div>
        <div class="cell"><span class="lab">km/h</span><span class="val led" id="hKmh">33</span></div>
        <div class="cell"><span class="lab">기회</span><div class="pips" id="hLives"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
      </div>

      <div class="field">
        <canvas id="cv" role="img" aria-label="패널티킥 막기 게임 화면. 골키퍼를 좌우로 움직여 슈팅을 막습니다."></canvas>

        <div class="overlay" id="ov">
          <div class="card" id="ovStart">
            <h2>패널티킥을 막아라</h2>
            <div>
              <label class="flabel" for="nick">순위표에 표시할 이름</label>
              <input type="text" id="nick" maxlength="12" placeholder="이름 또는 닉네임" autocomplete="off">
            </div>
            <div>
              <label class="flabel" for="team">내 팀 (유니폼 색)</label>
              <div class="teamrow">
                <canvas id="kitPrev" width="128" height="128" aria-hidden="true"></canvas>
                <select id="team"></select>
              </div>
            </div>
            <button class="btn" id="startBtn" type="button">킥오프</button>
            <ul class="rules">
              <li>방향키 또는 A·D, 터치·마우스로 골키퍼 이동</li>
              <li>레벨 4 커브 · 6 막판 가속 · 8 연속 슈팅</li>
            </ul>
          </div>

          <div class="card" id="ovEnd" hidden>
            <h2>경기 종료</h2>
            <div class="result"><span class="led" id="oSaves">0</span><span>선방</span></div>
            <p class="detail" id="oDetail"></p>
            <p class="status" id="oStatus"></p>
            <div class="btnrow">
              <button class="btn" id="againBtn" type="button">다시 도전</button>
              <button class="btn ghost" id="exitBtn" type="button">종료</button>
            </div>
          </div>
        </div>
      </div>
      <p class="mods">현재 슈팅 <b id="hMods">직선</b></p>
      <p class="hint">11m 거리의 패널티 스폿에서 슈팅이 날아옵니다.</p>
    </section>

    <aside class="rank" aria-label="순위표">
      <h2>순위표</h2>
      <p class="sub">선방 횟수가 많은 순서입니다. 같으면 먼저 달성한 사람이 위에 옵니다.</p>
      <div class="podium" id="podium" hidden></div>
      <ol id="rows"><li class="empty">순위표를 불러오는 중입니다.</li></ol>
      <p class="mybest" id="localBest"></p>
      <p class="note" id="rankNote"></p>
    </aside>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var W = 360, H = 560, R = 9, SPOT_X = 180, SPOT_Y = 112, GOAL_Y = 482, GK_Y = 468, GK_H = 16, SC = 2;
  var KMH = 0.1;

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  var cv = $('cv'), ctx = cv.getContext('2d');
  cv.width = W * SC; cv.height = H * SC;

  var cs = getComputedStyle(document.documentElement);
  function tok(n, f) { return cs.getPropertyValue(n).trim() || f; }
  var col = {
    turfA: tok('--turf-a', '#1d6a38'), turfB: tok('--turf-b', '#195e31'),
    chalk: tok('--chalk', '#eef3ea'), lamp: tok('--lamp', '#ffbe3b'),
    kick: tok('--kick', '#e24b3d'), net: tok('--net', '#0a110d'),
    goal: tok('--goal', '#ff6b57'), skin: tok('--skin', '#e8c8a2'), ink: tok('--ink', '#16201a')
  };
  var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  /* ---------- teams: Premier League 2026-27, kit colours only (no crests) ---------- */
  function mk(id, name, en, jersey, sleeve, shorts, socks, stripe) {
    return { id: id, name: name, en: en, jersey: jersey, sleeve: sleeve, shorts: shorts, socks: socks, stripe: stripe || null };
  }
  var TEAMS = [
    mk('ars', '아스널', 'Arsenal', '#db0007', '#f4f4ee', '#f4f4ee', '#db0007'),
    mk('avl', '애스턴 빌라', 'Aston Villa', '#7b003c', '#95bfe5', '#f4f4ee', '#95bfe5'),
    mk('bou', '본머스', 'Bournemouth', '#da291c', '#da291c', '#111815', '#da291c', '#111815'),
    mk('bre', '브렌트퍼드', 'Brentford', '#e30613', '#e30613', '#111815', '#e30613', '#f4f4ee'),
    mk('bha', '브라이턴', 'Brighton', '#0057b8', '#0057b8', '#f4f4ee', '#0057b8', '#f4f4ee'),
    mk('che', '첼시', 'Chelsea', '#034694', '#034694', '#034694', '#f4f4ee'),
    mk('cov', '코번트리', 'Coventry City', '#59cbe8', '#59cbe8', '#59cbe8', '#59cbe8'),
    mk('cry', '크리스털 팰리스', 'Crystal Palace', '#1b458f', '#1b458f', '#1b458f', '#1b458f', '#c4122e'),
    mk('eve', '에버턴', 'Everton', '#003399', '#003399', '#f4f4ee', '#003399'),
    mk('ful', '풀럼', 'Fulham', '#f4f4ee', '#f4f4ee', '#111815', '#f4f4ee'),
    mk('hul', '헐 시티', 'Hull City', '#f5a12d', '#f5a12d', '#111815', '#111815'),
    mk('ips', '입스위치', 'Ipswich Town', '#0044a9', '#0044a9', '#f4f4ee', '#0044a9'),
    mk('lee', '리즈', 'Leeds United', '#f4f4ee', '#f4f4ee', '#f4f4ee', '#f4f4ee'),
    mk('liv', '리버풀', 'Liverpool', '#c8102e', '#c8102e', '#c8102e', '#c8102e'),
    mk('mci', '맨시티', 'Manchester City', '#6cabdd', '#6cabdd', '#f4f4ee', '#6cabdd'),
    mk('mun', '맨유', 'Manchester United', '#da291c', '#da291c', '#f4f4ee', '#111815'),
    mk('new', '뉴캐슬', 'Newcastle', '#1c1c1c', '#1c1c1c', '#111815', '#1c1c1c', '#f4f4ee'),
    mk('nfo', '노팅엄', 'Nottingham Forest', '#dd0000', '#dd0000', '#f4f4ee', '#dd0000'),
    mk('sun', '선덜랜드', 'Sunderland', '#eb172b', '#eb172b', '#111815', '#eb172b', '#f4f4ee'),
    mk('tot', '토트넘', 'Tottenham Hotspur', '#f4f4ee', '#f4f4ee', '#132257', '#f4f4ee')
  ];
  var TEAM_BY_ID = Object.create(null);
  TEAMS.forEach(function (t) { TEAM_BY_ID[t.id] = t; });
  var teamSel = $('team');
  function curTeam() { return TEAM_BY_ID[teamSel.value] || TEAMS[0]; }

  function rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function lum(h) { var c = rgb(h); return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
  function cdist(a, b) { var x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); }
  function kickColorFor(t) {
    var c = ['#e24b3d', '#3b6fe0', '#f4f4ee'], best = c[0], bd = -1;
    c.forEach(function (h) { var d = cdist(h, t.jersey); if (d > bd) { bd = d; best = h; } });
    return best;
  }

  /* goalkeeper: front-facing figure, arms spread to the current width */
  function rrC(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
    c.fill(); c.stroke();
  }
  function ci(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke(); }
  function drawKeeper(c, x, y, gw, tilt, t) {
    var half = gw / 2;
    c.save();
    c.translate(x, y + 16); c.rotate(tilt); c.translate(0, -16);
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.fillStyle = 'rgba(0,0,0,0.25)';
    c.beginPath(); c.ellipse(0, 38, 17, 4, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(12,19,15,0.5)'; c.lineWidth = 1;
    c.fillStyle = t.socks; rrC(c, -9, 18, 7, 15, 3); rrC(c, 2, 18, 7, 15, 3);
    c.fillStyle = '#111815'; rrC(c, -10, 31, 9, 5, 2); rrC(c, 1, 31, 9, 5, 2);
    c.fillStyle = t.shorts; rrC(c, -12, 8, 24, 12, 4);
    // arms
    c.strokeStyle = 'rgba(12,19,15,0.5)'; c.lineWidth = 11;
    c.beginPath(); c.moveTo(-10, -2); c.lineTo(-half + 6, -4); c.moveTo(10, -2); c.lineTo(half - 6, -4); c.stroke();
    c.strokeStyle = t.sleeve; c.lineWidth = 9;
    c.beginPath(); c.moveTo(-10, -2); c.lineTo(-half + 6, -4); c.moveTo(10, -2); c.lineTo(half - 6, -4); c.stroke();
    c.strokeStyle = 'rgba(12,19,15,0.5)'; c.lineWidth = 1;
    c.fillStyle = '#f4f4ee'; ci(c, -half + 4, -4, 8); ci(c, half - 4, -4, 8);
    // torso
    c.fillStyle = t.jersey; rrC(c, -13, -9, 26, 19, 6);
    if (t.stripe) {
      c.fillStyle = t.stripe;

  /* ---------- static pitch ---------- */
  var pitch = document.createElement('canvas');

      p.fillStyle = i % 2 ? col.turfB : col.turfA;

    for (x = 0; x <= W; x += 12) { p.moveTo(x + 0.5, GOAL_Y); p.lineTo(x + 0.5, H); }
    for (y = GOAL_Y + 6; y <= H; y += 12) { p.moveTo(0, y + 0.5); p.lineTo(W, y + 0.5); }
    p.stroke();
    p.fillStyle = 'rgba(0,0,0,0.28)'; p.fillRect(0, 0, 4, GOAL_Y); p.fillRect(W - 4, 0, 4, GOAL_Y);
    p.strokeStyle = col.chalk; p.globalAlpha = 0.85; p.lineWidth = 2;
    p.strokeRect(44, 372, 272, GOAL_Y - 372);
    p.lineWidth = 3; p.beginPath(); p.moveTo(0, GOAL_Y); p.lineTo(W, GOAL_Y); p.stroke();
    p.globalAlpha = 1;
    p.fillStyle = col.chalk;
    [6, W - 6].forEach(function (px) { p.beginPath(); p.arc(px, GOAL_Y, 5, 0, Math.PI * 2); p.fill(); });
    p.beginPath(); p.arc(SPOT_X, SPOT_Y, 3.5, 0, Math.PI * 2); p.fill();

    p.globalAlpha = 0.55; p.strokeStyle = col.chalk; p.lineWidth = 1.5;
    p.beginPath();
    p.moveTo(24, SPOT_Y); p.lineTo(24, GOAL_Y);
    p.moveTo(19, SPOT_Y + 0.5); p.lineTo(29, SPOT_Y + 0.5);
    p.moveTo(19, GOAL_Y - 0.5); p.lineTo(29, GOAL_Y - 0.5);
    p.stroke();
    p.fillStyle = col.chalk; p.font = '600 11px "Noto Sans KR", sans-serif';

  /* ---------- difficulty ---------- */
  function params(L) {
    return {
      speed: Math.min(330 + 30 * (L - 1), 880),
      half: Math.min(36 + 14 * (L - 1), 150),
      curve: L >= 4 ? Math.min(40 * (L - 3), 420) : 0,
      gw: Math.max(54, 112 - 4 * (L - 1)),
      n: L >= 16 ? 3 : (L >= 8 ? 2 : 1),
      burst: L >= 6
    };

  function peakKmh(p) { return Math.round(p.speed * (p.burst ? 1.35 : 1) * KMH); }
  function modsText(p) {
    var m = [p.curve ? '커브' : '직선'];
    if (p.burst) m.push('막판 가속');
    if (p.n > 1) m.push('연속 ' + p.n + '구');

  /* ---------- game state ---------- */

  g = newGame();

  function spawnRound() {
    var p = params(g.level), i;
    g.n = p.n;
    g.kmh = peakKmh(p);
    for (i = 0; i < p.n; i++) {
      g.balls.push({
        state: 'wait', delay: (g.first ? 1.1 : 0.4) + i * 0.5,
        x: SPOT_X, y: SPOT_Y, vx: 0, ax: 0, v1: 0, v2: 0, d1: 0, cur: 0,
        rot: Math.random() * 6, t: 0, trail: [], p: p, dead: false

    g.first = false;
  }

  function launch(b) {
    var p = b.p;
    var tx = clamp(W / 2 + rand(-p.half, p.half), 26, W - 26);
    var D = GK_Y - SPOT_Y;
    var v1 = p.speed, v2 = p.speed, d1 = 0, T;
    if (p.burst) { v1 = p.speed * 0.6; v2 = p.speed * 1.35; d1 = D * 0.4; T = d1 / v1 + (D - d1) / v2; }
    else { T = D / v1; }

    b.ax = ax; b.v1 = v1; b.v2 = v2; b.d1 = d1; b.cur = v1;

  function burst(x, y, c, n) {

    }
  }
  function say(s, x, y, c) { g.texts.push({ s: s, x: clamp(x, 40, W - 40), y: y, c: c, t: 0 }); }

  function save(b) {
    b.state = 'saved'; b.t = 0;

    g.saves++; g.level++;

    say('선방! 레벨 ' + g.level, g.gx, GK_Y - 28, col.lamp);
  }
  function concede(b) {
    b.state = 'goal'; b.t = 0; b.vy = 140;

    say('실점', b.x, GOAL_Y - 20, col.goal);

  }

  /* ---------- update ---------- */
  var keys = { left: false, right: false };
  function update(dt) {

    g.tx = clamp(g.tx, g.gw / 2, W - g.gw / 2);
    var step = 1100 * dt, gx0 = g.gx;

    g.gx = clamp(g.gx, g.gw / 2, W - g.gw / 2);
    if (dt > 0) {
      var want = calm ? 0 : clamp((g.gx - gx0) / dt / 4500, -0.24, 0.24);

    }

    if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 40);
    if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 2.2);

    var i, b;
    for (i = 0; i < g.balls.length; i++) {

      } else if (b.state === 'fly') {

        b.vx += b.ax * dt; b.x += b.vx * dt; b.y += b.cur * dt; b.rot += dt * 9;
        if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); }
        else if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); }
        b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 7) b.trail.shift();

        b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += dt * 9;

  /* ---------- HUD ---------- */

  function saveScore(s, kmh) {

  }

  $('startBtn').addEventListener('click', startGame);

  /* ---------- input ---------- */
  function setTarget(e) {

  function getPlayerId() {

        : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

  function sbFetch(path, opts) {

    if (String(CFG.SUPABASE_ANON_KEY).indexOf('eyJ') === 0) h.Authorization = 'Bearer ' + CFG.SUPABASE_ANON_KEY;
    opts.headers = h;

  }
  var rowsEl = $('rows'), podiumEl = $('podium'), noteEl = $('rankNote');
  function setNote(s) { noteEl.textContent = s || ''; }

  function renderRank() {
    rowsEl.textContent = '';
    podiumEl.textContent = '';
    var list = rows.filter(function (r) { return typeof r.saves === 'number'; })
      .sort(function (a, b) { return b.saves - a.saves || (a.at || 0) - (b.at || 0); });
    podiumEl.hidden = !list.length;
    if (!list.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = !listening ? '순위표가 아직 연결되지 않았습니다.'
        : (loaded ? '아직 기록이 없습니다. 첫 기록을 남겨 보세요.' : '순위표를 불러오는 중입니다.');

    function row(r, i) {
      var li = document.createElement('li');
      var cls = [];

      li.className = cls.join(' ');
      var rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = i + 1;
      var mid = document.createElement('div');
      var nr = document.createElement('div'); nr.className = 'nmrow';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (typeof r.name === 'string' && r.name) ? r.name : '무명 키퍼';
      nr.appendChild(nm);
      if (r.id === uid) { var c = document.createElement('span'); c.className = 'chip'; c.textContent = '나'; nr.appendChild(c); }
      var sub = document.createElement('span'); sub.className = 'sub2';
      var tm = TEAM_BY_ID[r.team];
      if (tm) {
        var kt = document.createElement('span'); kt.className = 'kit';
        kt.style.setProperty('--k1', tm.jersey); kt.style.setProperty('--k2', tm.shorts);
        sub.appendChild(kt);
      }
      var bits = [];
      if (tm) bits.push(tm.name);
      if (typeof r.kmh === 'number') bits.push('최고 ' + r.kmh + ' km/h');
      sub.appendChild(document.createTextNode(bits.join(' · ')));
      mid.appendChild(nr); mid.appendChild(sub);
      var sc = document.createElement('div'); sc.className = 'sc';
      var n = document.createElement('span'); n.className = 'led'; n.textContent = r.saves;
      var u = document.createElement('small'); u.textContent = '선방';
      sc.appendChild(n); sc.appendChild(u);
      li.appendChild(rk); li.appendChild(mid); li.appendChild(sc);
      return li;
    }
    function slot(r, i) {
      var s = document.createElement('div');
      s.className = 'pslot p' + (i + 1) + (r && r.id === uid ? ' me' : '') + (r ? '' : ' vacant');
      var info = document.createElement('div'); info.className = 'pinfo';
      if (r) {
        var pn = document.createElement('div'); pn.className = 'pname';
        var nm = document.createElement('span'); nm.className = 'nm';
        nm.textContent = (typeof r.name === 'string' && r.name) ? r.name : '무명 키퍼';
        pn.appendChild(nm);
        if (r.id === uid) { var c = document.createElement('span'); c.className = 'chip'; c.textContent = '나'; pn.appendChild(c); }
        info.appendChild(pn);
        var tm = TEAM_BY_ID[r.team];
        var pt = document.createElement('div'); pt.className = 'pteam';
        if (tm) {
          var kt = document.createElement('span'); kt.className = 'kit';
          kt.style.setProperty('--k1', tm.jersey); kt.style.setProperty('--k2', tm.shorts);
          pt.appendChild(kt);
          pt.appendChild(document.createTextNode(tm.name));
        } else { pt.textContent = ' '; }
        info.appendChild(pt);
        var ps = document.createElement('div'); ps.className = 'pscore';
        var n = document.createElement('span'); n.className = 'led'; n.textContent = r.saves;
        var u = document.createElement('small'); u.textContent = '선방';
        ps.appendChild(n); ps.appendChild(u);
        info.appendChild(ps);
      }
      var step = document.createElement('div'); step.className = 'pstep'; step.textContent = i + 1;
      s.appendChild(info); s.appendChild(step);
      return s;
    }
    // 시상대 배치: 2위 - 1위 - 3위
    [1, 0, 2].forEach(function (i) { podiumEl.appendChild(slot(list[i] || null, i)); });
    var base = document.createElement('div'); base.className = 'podium-base'; podiumEl.appendChild(base);

    list.slice(3, 15).forEach(function (r, i) { rowsEl.appendChild(row(r, i + 3)); });
    var mi = list.findIndex(function (r) { return r.id === uid; });
    if (mi >= 15) rowsEl.appendChild(row(list[mi], mi));
  }

  function refreshRank() {
    return sbFetch('/rest/v1/scores?select=player_id,name,team,saves,kmh,achieved_at&order=saves.desc,achieved_at.asc&limit=200')
      .then(function (data) {
        rows = (data || []).map(function (d) {
          return { id: d.player_id, name: d.name, team: d.team, saves: d.saves, kmh: d.kmh, at: Date.parse(d.achieved_at) || 0 };
        });
        loaded = true;
        setNote('한 사람당 최고 기록 하나만 남습니다. 브라우저를 바꾸면 새 기록으로 시작합니다.');
        myBest = rows.find(function (r) { return r.id === uid; }) || null;
        if (myBest && !nick.value && typeof myBest.name === 'string') nick.value = myBest.name;
        renderRank();
      })
      .catch(function () { if (!loaded) setNote('순위표를 불러오지 못했습니다. 잠시 뒤 다시 시도합니다.'); });
  }

  function initRank() {
    if (!SB.ok) {
      setNote('순위표가 연결되지 않았습니다. config.js에 Supabase 주소와 키를 넣어 주세요. 지금은 이 기기의 기록만 남습니다.');
      renderRank();
      return;
    }
    listening = true;
    renderRank();
    refreshRank();
    setInterval(function () { if (document.visibilityState === 'visible') refreshRank(); }, 20000);
  }

  var prev = $('kitPrev').getContext('2d');
  function drawPreview() {
    prev.setTransform(2, 0, 0, 2, 0, 0);
    prev.clearRect(0, 0, 64, 64);
    drawKeeper(prev, 32, 22, 48, 0, curTeam());
  }
  function onTeamChange() {
    if (g.state !== 'play') { g.team = curTeam(); g.kick = kickColorFor(g.team); }
    drawPreview();
  }
  TEAMS.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t.id; o.textContent = t.name; o.title = t.en;
    teamSel.appendChild(o);
  });
  teamSel.value = TEAM_BY_ID[store.get('pks-team')] ? store.get('pks-team') : TEAMS[0].id;
  teamSel.addEventListener('change', onTeamChange);
  onTeamChange();

  nick.value = store.get('pks-name') || '';
  showLocalBest();
  renderRank();
  initRank();
})();
</script>
</body>
</html>
